name: Build CyberSafe Windows Forms App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore CybersecurityAwarenessChatbot.csproj
      - name: Build project
        run: dotnet build CybersecurityAwarenessChatbot.csproj --configuration Release --no-restore
